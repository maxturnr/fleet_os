[build]
  publish = "files"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/FleetOS_v2.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/FleetOS_v2.html"
  status = 200

[dev]
  functions = "netlify/functions"
  publish = "files"
